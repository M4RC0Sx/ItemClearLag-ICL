plugins {
    id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.3.2' apply false
    id 'co.uzzu.dotenv.gradle' version "4.0.0"
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$rootProject.minecraft_version-$project.name"
    }

    repositories {
        maven {
            name = "TerraformersMC (ModMenu)"
            url = "https://maven.terraformersmc.com/releases/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}

publishMods {
    changelog = file("$rootDir/CHANGELOG.md").text
    type = STABLE

    def withSources = true

    def cfOptions = curseforgeOptions {
        accessToken = env.fetchOrNull("CURSEFORGE_TOKEN") ?: System.getProperty("CURSEFORGE_TOKEN")
        projectId = "1001584"
        changelogType = "markdown"
        minecraftVersionRange {
            start = project.minecraft_version
            end = "1.21.11"
        }
        clientRequired = true
        serverRequired = false
    }

    def mrOptions = modrinthOptions {
        accessToken = env.fetchOrNull("MODRINTH_TOKEN") ?: System.getProperty("MODRINTH_TOKEN")
        projectId = "NJcJEXNc"
        minecraftVersionRange {
            start = project.minecraft_version
            end = "1.21.11"
        }
    }

    curseforge("curseforgeFabric") {
        from cfOptions
        file project(":fabric")
        if (withSources) {
            additionalFiles.from(project(":fabric").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
        displayName = "[Fabric] " + "ICL-" + project.minecraft_version + "-" + project.version
    }

    curseforge("curseforgeForge") {
        from cfOptions
        file project(":forge")
        if (withSources) {
            additionalFiles.from(project(":forge").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("forge")
        displayName = "[Forge] " + "ICL-" + project.minecraft_version + "-" + project.version
    }

    curseforge("curseforgeNeoForge") {
        from cfOptions
        file project(":neoforge")
        if (withSources) {
            additionalFiles.from(project(":neoforge").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("neoforge")
        displayName = "[NeoForge] " + "ICL-" + project.minecraft_version + "-" + project.version
    }

    modrinth("modrinthFabric") {
        from mrOptions
        file project(":fabric")
        if (withSources) {
            additionalFiles.from(project(":fabric").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("fabric")
        requires {
            slug = "fabric-api"
        }
        displayName = "[Fabric] " + "ICL-" + project.minecraft_version + "-" + project.version
    }

    modrinth("modrinthForge") {
        from mrOptions
        file project(":forge")
        if (withSources) {
            additionalFiles.from(project(":forge").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("forge")
        displayName = "[Forge] " + "ICL-" + project.minecraft_version + "-" + project.version
    }

    modrinth("modrinthNeoForge") {
        from mrOptions
        file project(":neoforge")
        if (withSources) {
            additionalFiles.from(project(":neoforge").tasks.named("remapSourcesJar"))
        }
        modLoaders.add("neoforge")
        displayName = "[NeoForge] " + "ICL-" + project.minecraft_version + "-" + project.version
    }
}